name: DSA held-out measurement
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/empirical-raw-logits.yml'
      - 'experiments/empirical_raw_logits.py'
permissions:
  contents: read
jobs:
  measurement:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
      CMAKE_ARGS: '-DGGML_CUDA=OFF -DGGML_BLAS=OFF'
      OMP_NUM_THREADS: '4'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned public research dependencies
        run: python -m pip install numpy==1.26.4 scipy==1.14.1 scikit-learn==1.6.1 huggingface_hub==0.34.4 jinja2==3.1.6 llama-cpp-python==0.3.16
      - name: Run arithmetic evaluation with local raw evidence capture
        run: python -u -m experiments.empirical_raw_logits --outdir runs/empirical-7b
      - name: Save arithmetic research results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsa-7b-measurement
          path: runs/empirical-7b/
          retention-days: 30
          compression-level: 1
          if-no-files-found: warn

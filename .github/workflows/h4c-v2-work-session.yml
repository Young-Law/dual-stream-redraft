name: H4-C v2 Work Session Calibration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/h4c-v2-work-session.yml"

permissions:
  contents: read

jobs:
  h4c-v2-seed11:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install -e .

      - name: Create protected development key
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("H4C_PROTECTED_KEY_HEX=" + secrets.token_hex(32))
          PY

      - name: Run Qwen2.5-3B v2 calibration
        run: |
          mkdir -p runs/h4c
          python -m experiments.h4c_local_model_development \
            --model Qwen/Qwen2.5-3B-Instruct \
            --model-revision aa8e72537993ba99e69dfaafa59ed015b17504d1 \
            --seeds 11 \
            --allow-network \
            --device cpu \
            --json-out runs/h4c/qwen25-3b-development-v2-seed11.json \
            > /dev/null

      - name: Run development gate
        run: |
          python -m experiments.h4c_development_gate \
            runs/h4c/qwen25-3b-development-v2-seed11.json \
            --json-out runs/h4c/qwen25-3b-development-v2-seed11-gate.json \
            > /dev/null

      - name: Run paired analysis
        run: |
          python -m experiments.h4c_paired_analysis \
            runs/h4c/qwen25-3b-development-v2-seed11.json \
            --json-out runs/h4c/qwen25-3b-development-v2-seed11-analysis.json \
            > /dev/null

      - name: Summarize competence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          p="runs/h4c/qwen25-3b-development-v2-seed11.json"
          d=json.load(open(p, encoding="utf-8"))
          assert d["scenario_schema"] == "h4c-model-development-v2"
          assert d["prompt_format"] == "chat-template-v1"
          assert len(d["records"]) == 36
          for condition in ("C0","C1","C2"):
              rs=[r for r in d["records"] if r["spec"]["condition"]==condition]
              ok=sum(r["result"]["task_success"] for r in rs)
              print(condition, ok, "/", len(rs))
              print(Counter(r["result"]["task_failure_reason"] for r in rs))
          PY

      - name: Upload JSON artifacts
        uses: actions/upload-artifact@v4
        with:
          name: h4c-qwen25-3b-v2-seed11
          path: |
            runs/h4c/qwen25-3b-development-v2-seed11.json
            runs/h4c/qwen25-3b-development-v2-seed11-gate.json
            runs/h4c/qwen25-3b-development-v2-seed11-analysis.json
          if-no-files-found: error
          retention-days: 7

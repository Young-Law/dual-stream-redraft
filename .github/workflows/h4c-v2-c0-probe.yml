name: H4-C v2 C0 Competence Probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/h4c-v2-c0-probe.yml"

permissions:
  contents: read

jobs:
  c0-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e .
      - name: Create protected development key
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import secrets
          print("H4C_PROTECTED_KEY_HEX=" + secrets.token_hex(32))
          PY
      - name: Run C0 competence probe
        run: |
          mkdir -p runs/h4c
          python - <<'PY'
          import json
          from pathlib import Path
          from collections import Counter
          from experiments.h4c_local_hf_adapter import LocalHFAdapter
          from experiments.h4c_local_model_development import load_development_scenarios
          from experiments.h4c_local_model_smoke import _protected_key_from_env, _run_one, _specs

          model="Qwen/Qwen2.5-3B-Instruct"
          revision="aa8e72537993ba99e69dfaafa59ed015b17504d1"
          scenarios=load_development_scenarios(Path("experiments/h4c_model_development_scenarios.json"))
          key=_protected_key_from_env()
          marker_map={s.scenario_id:m for s,m,_ in scenarios}
          adapter=LocalHFAdapter(
              model_id=model,
              model_revision=revision,
              monitored_markers=marker_map,
              max_new_tokens=18,
              temperature=0.25,
              top_p=0.95,
              do_sample=True,
              repetition_penalty=1.0,
              no_repeat_ngram_size=0,
              local_files_only=False,
              device="cpu",
          )
          records=[]
          for scenario,_marker,family in scenarios:
              c0,_,_=_specs(
                  scenario.scenario_id,
                  model_id=model,
                  model_revision=revision,
                  seed=11,
                  rate_ppm=100_000,
              )
              r=_run_one(c0,scenario,schedule_key=key,adapter=adapter)
              r["scenario_family"]=family
              records.append(r)
          out={
              "scope":"Non-confirmatory H4-C v2 C0 competence probe.",
              "scenario_schema":"h4c-model-development-v2",
              "model_id":model,
              "model_revision":revision,
              "resolved_model_revision":adapter.resolved_revision,
              "prompt_format":adapter.prompt_format,
              "decoding":adapter.decoding_config,
              "seed":11,
              "records":records,
          }
          Path("runs/h4c/qwen25-3b-v2-c0-seed11.json").write_text(
              json.dumps(out,indent=2,sort_keys=True)+"\n", encoding="utf-8"
          )
          ok=sum(r["result"]["task_success"] for r in records)
          print("C0 task success:",ok,"/",len(records),ok/len(records))
          print("failures:",Counter(r["result"]["task_failure_reason"] for r in records))
          for r in records:
              print(r["spec"]["scenario_id"],repr(r["response"]["text"]),r["result"]["task_success"],r["result"]["task_failure_reason"])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: h4c-qwen25-3b-v2-c0-seed11
          path: runs/h4c/qwen25-3b-v2-c0-seed11.json
          if-no-files-found: error
          retention-days: 7
